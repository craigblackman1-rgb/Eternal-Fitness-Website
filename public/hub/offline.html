<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — EF Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #FDFDFE;
      color: #1a2138;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
    }
    .box {
      text-align: center;
      max-width: 320px;
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 9999px;
      background: rgba(193,131,159,0.12);
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
    }
    .icon svg {
      width: 24px;
      height: 24px;
      stroke: #C1839F;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p {
      font-size: 14px;
      color: #596178;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    button {
      background: #C1839F;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Reconnect to use the hub.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
